<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>You're offline · Wallpaperz</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #020817; color: #f8fafc;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center;
    }
    main { max-width: 22rem; }
    img { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 20px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #f8fafc; color: #0f172a; font: inherit; font-weight: 600;
      padding: 10px 20px; border-radius: 9999px;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main>
    <img src="/web-app-manifest-192x192-maskable.png" alt="" width="72" height="72">
    <h1>You're offline</h1>
    <p>Wallpaperz needs a connection to load fresh wallpapers. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener('online', function () { location.reload() })</script>
</body>
</html>
